[project]
name = "remote-workbench"
version = "0.3.0a14"
description = "Local MCP control for remote SSH workspaces with bounded output and readable audit diffs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0,<2",  # 2.0 removed mcp.server.fastmcp
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "websockets>=12.0",
    "asyncssh>=2.14",
]

[project.urls]
Repository = "https://github.com/chanfeee/remote-workbench"
Issues = "https://github.com/chanfeee/remote-workbench/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
images = [
    "pillow>=10,<13",
    "pypdfium2>=4,<6",
    "resvg-py>=0.2,<1",
]

[project.scripts]
remote-workbench = "remote_workbench.cli:main"
remote-workbench-ssh = "remote_workbench.__main__:main"
remote-workbench-setup = "remote_workbench.setup:main"
remote-workbench-web = "remote_workbench.web.__main__:main"
remote-workbench-audit = "remote_workbench.audit_web:main"
remote-workbench-workspace = "remote_workbench.workspace:main"
remote-workbench-session = "remote_workbench.session_server:main"
remote-workbench-cleanup = "remote_workbench.cleanup:main"

[tool.hatch.build.targets.wheel]
packages = ["remote_workbench"]
artifacts = ["remote_workbench/scripts/*.sh"]

[tool.hatch.build.targets.sdist]
include = [
    "/remote_workbench",
    "/tests",
    "/scripts",
    "/docs",
    "/.github",
    "/.gitignore",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/README.upstream.md",
    "/UPSTREAM.md",
    "/VALIDATION.md",
    "/pyproject.toml",
    "/uv.lock",
    "/codex-mcp.example.toml",
    "/config.example.yaml",
    "/workspace.example.json",
    "/start-audit.command",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
