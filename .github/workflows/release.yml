name: Stable release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Final version already committed to stable (X.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-stable-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate and prepare stable release
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tooling from the dispatched main commit
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false

      - name: Check out the stable candidate
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'stable' }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Validate immutable candidate and version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "$RELEASE_EVENT" = "push" ]; then
            python release-tools/scripts/check_release_candidate.py \
              --project candidate --tag-ref "$RELEASE_REF" \
              --output "$RUNNER_TEMP/release-candidate.json"
          else
            python release-tools/scripts/check_release_candidate.py \
              --project candidate --version "$RELEASE_VERSION" \
              --output "$RUNNER_TEMP/release-candidate.json"
          fi

      - name: Confirm browser-script test runtime
        run: node --version

      - name: Test the candidate
        working-directory: candidate
        run: uv run --frozen --python 3.13 --extra dev --extra images pytest -q

      - name: Recheck tested sources before building
        run: |
          RELEASE_VERSION=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/release-candidate.json"))["version"])')
          python release-tools/scripts/check_release_candidate.py \
          --project candidate --version "$RELEASE_VERSION"

      - name: Build release assets
        working-directory: candidate
        run: |
          uv build
          uv export --frozen --no-dev --extra images --no-emit-project --no-hashes --output-file dist/runtime-requirements.txt
          cd dist
          sha256sum *.whl *.tar.gz runtime-requirements.txt > SHA256SUMS

      - name: Publish an explicit tag or prepare a manual draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          TAG=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/release-candidate.json"))["tag"])')
          COMMIT=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/release-candidate.json"))["commit"])')
          if [ "$RELEASE_EVENT" = "push" ]; then
            test -f "candidate/docs/releases/$TAG.md"
            gh release create "$TAG" candidate/dist/* --verify-tag --target "$COMMIT" \
              --title "Remote Workbench $TAG" --notes-file "candidate/docs/releases/$TAG.md" --draft
            gh release edit "$TAG" --draft=false --latest
          else
            gh release create "$TAG" candidate/dist/* --target "$COMMIT" --title "$TAG" --generate-notes --draft
          fi
