<!doctype html>
<!-- Layout and colors adapted from liteRemote activity/review UI, AGPL-3.0; see UPSTREAM.md. -->
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Remote Workbench · 操作记录</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--surface:#f7f7f8;--border:rgba(31,35,40,.13);--text:#202124;--muted:#6f7378;--green:#169b53;--green-bg:rgba(22,155,83,.11);--red:#d64545;--red-bg:rgba(214,69,69,.10);--blue:#2980b9;--yellow:#a66b00}
@media(prefers-color-scheme:dark){:root{--bg:#171717;--surface:#222223;--border:rgba(255,255,255,.13);--text:#ececec;--muted:#a4a4a6;--green:#42c77b;--green-bg:rgba(66,199,123,.13);--red:#ff7070;--red-bg:rgba(255,112,112,.12);--blue:#66b8e8;--yellow:#f3bd62}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 12px;border-bottom:1px solid var(--border)}.title{font-weight:620}.workspace{min-width:0;color:var(--muted);overflow-wrap:anywhere}.status{grid-row:1/span 2;grid-column:2;align-self:center;color:var(--green)}.failed{color:var(--red)}.warning{color:var(--yellow)}
.counts{display:flex;flex-wrap:wrap;gap:6px;padding:9px 12px;border-bottom:1px solid var(--border)}.count{padding:3px 7px;border-radius:6px;background:var(--surface);color:var(--muted)}
details.section{border-bottom:1px solid var(--border)}details.section>summary{padding:10px 12px;cursor:pointer;font-weight:620}.section-count{color:var(--muted);font-weight:400}.item{border-top:1px solid var(--border)}.item>summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:9px 12px;cursor:pointer}.primary{min-width:0;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}.metric{color:var(--muted);font-size:11px;white-space:nowrap}.detail{padding:0 12px 10px}.secondary{margin-top:4px;color:var(--muted);font-size:11px;overflow-wrap:anywhere}
.file-row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--border)}.file-icon{display:grid;place-items:center;width:18px;height:18px;border-radius:4px;color:white;background:var(--blue);font-size:10px;font-weight:700}.file-path{overflow-wrap:anywhere}.stat{font-variant-numeric:tabular-nums;white-space:nowrap}.add{color:var(--green)}.del{color:var(--red)}
pre{max-height:320px;margin:7px 0 0;overflow:auto;padding:9px 10px;border-radius:6px;background:var(--surface);color:var(--text);font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.stderr{color:var(--red);background:var(--red-bg)}.diff{padding:0}.line{display:block;min-height:1.55em;padding:0 12px;white-space:pre}.line.added{color:var(--green);background:var(--green-bg)}.line.deleted{color:var(--red);background:var(--red-bg)}.line.meta{color:var(--muted)}.stream{margin:8px 0}.stream>summary{cursor:pointer;color:var(--muted)}.empty,.error{padding:16px 12px;color:var(--muted)}.error{color:var(--red)}.foot{padding:8px 12px;color:var(--muted);font-size:11px}button{font:inherit;margin-top:7px;padding:4px 9px;cursor:pointer}button:disabled{opacity:.6;cursor:default}summary:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
@media(max-width:520px){.item>summary{grid-template-columns:minmax(0,1fr)}.metric{white-space:normal}}
</style>
<main aria-live="polite"><div id="cards"><div class="empty">等待操作数据…</div></div><div id="error" class="error" role="status"></div></main>
<script>
(() => {
  'use strict';
  const cards = document.getElementById('cards');
  const error = document.getElementById('error');
  const pending = new Map();
  let serial = 0, generation = 0;
  const node = (tag, value, cls) => {const el = document.createElement(tag); if (value !== undefined) el.textContent = String(value); if(cls)el.className=cls; return el;};
  const notify = (method, params) => window.parent.postMessage({jsonrpc:'2.0',method,params}, '*');
  function rpc(method, params) {
    return new Promise((resolve,reject) => {
      const id = ++serial;
      const timer = setTimeout(() => {pending.delete(id); reject(new Error('界面读取超时；不会重新执行命令'));}, 15000);
      pending.set(id, {resolve,reject,timer});
      window.parent.postMessage({jsonrpc:'2.0',id,method,params}, '*');
    });
  }
  function unpack(result) {
    if (result.isError) throw new Error(result.content?.[0]?.text || '读取失败');
    return result.structuredContent || JSON.parse(result.content.find(x => x.type === 'text').text);
  }
  function resize() {
    notify('ui/notifications/size-changed', {height:document.documentElement.scrollHeight});
  }
  function paint(pre,text,diff) {
    if(!diff){pre.textContent=text || '（空）';return;}
    pre.replaceChildren();
    for(const line of String(text).split('\n')){
      const cls=/^(diff --git|index |@@|--- |\+\+\+ )/.test(line)?'meta':line.startsWith('+')?'added':line.startsWith('-')?'deleted':'';
      pre.append(node('span',line,'line '+cls));
    }
  }
  function section(title,count){const el=node('details',undefined,'section');el.open=true;const summary=node('summary',title+' ');summary.append(node('span',count,'section-count'));el.append(summary);el.addEventListener('toggle',resize);return el;}
  function failed(step){return Boolean(step.error||step.timed_out||(step.exit_code!=null&&step.exit_code!==0)||['failed','cancelled','timeout'].includes(step.state));}
  function render(result) {
    const payload = result?._meta?.['remote-workbench/operation'] || result?.['remote-workbench/operation'];
    if (!payload?.steps) return;
    const current = ++generation;
    error.textContent = '';
    cards.replaceChildren();
    const commands=payload.steps.filter(s=>s.tool==='exec_command'),patches=payload.steps.filter(s=>s.tool==='apply_patch');
    const bad=payload.steps.some(failed),unknown=payload.steps.some(s=>s.exit_code==null&&!['success','finished','checked'].includes(s.state));
    const header=node('header',undefined,'header');
    header.append(node('span','Remote Workbench 操作记录','title'),node('span',[payload.steps[0]?.host,payload.steps[0]?.cwd].filter(Boolean).join(' · '),'workspace'),node('span',bad?'操作失败':unknown?'状态待核实':'已完成','status'+(bad?' failed':unknown?' warning':'')));
    cards.append(header);
    const files=patches.flatMap(s=>s.diff_summary?.files || []),partial=patches.some(s=>s.diff_summary&&!s.diff_summary.complete),preview=patches.some(s=>s.check_only);
    const counts=node('div',undefined,'counts');counts.append(node('span','执行 '+commands.length+' 条命令','count'),node('span',(preview?'拟修改 ':partial?'已读到 ':'修改 ')+files.length+' 个文件'+(partial?'（片段）':''),'count'));cards.append(counts);
    const commandGroup=commands.length?section('执行命令',commands.length):null;
    if(commandGroup)cards.append(commandGroup);
    for (const step of payload.steps) {
      const isPatch=step.tool==='apply_patch';
      const article=isPatch?section(step.check_only?'补丁预览':'文件变更',step.diff_summary?.files?.length ?? '未知'):node('details',undefined,'item');
      const body=node('div',undefined,'detail');
      if(!isPatch){const summary=node('summary');summary.append(node('span',step.command || '命令未取得','primary'),node('span',(step.exit_code==null?'exit 未知':'exit '+step.exit_code)+(step.timed_out?' · 已超时':'')+(Number.isFinite(step.elapsed_ms)?' · '+(step.elapsed_ms/1000).toFixed(2)+'s':''),'metric'+(failed(step)?' failed':'')));article.append(summary);}
      body.append(node('div',[step.host,step.cwd].filter(Boolean).join(' · '),'secondary'));
      if (step.error) body.append(node('pre',step.error,'stderr'));
      const fileRows=step.diff_summary?.files || [],diffData=step.streams?.diff;
      const chunks=diffData?.content?.includes('diff --git ')?diffData.content.split(/(?=^diff --git )/m).filter(x=>x.startsWith('diff --git ')):[diffData?.content || ''];
      const perFile=Boolean(diffData&&!diffData.truncated&&fileRows.length&&chunks.length===fileRows.length);
      for(const [index,file] of fileRows.entries()){
        const row=node(perFile?'summary':'div',undefined,'file-row'),stat=node('span',undefined,'stat');
        const ext=String(file.path).split('.').pop().toLowerCase();
        row.append(node('span',ext==='py'?'Py':['js','ts','jsx','tsx'].includes(ext)?'JS':'F','file-icon'),node('span',file.path,'file-path'));
        stat.append(node('span','+'+file.added,'add'),node('span',' −'+file.deleted,'del'));row.append(stat);
        if(perFile){const change=node('details',undefined,'file-change'),pre=node('pre',undefined,'diff');paint(pre,chunks[index],true);change.append(row,pre);change.addEventListener('toggle',resize);body.append(change);}
        else body.append(row);
      }
      for (const [stream, initial] of Object.entries(step.streams || {})) {
        if(stream==='diff'&&perFile)continue;
        const details = node('details',undefined,'stream');
        details.open = true;
        const pre = node('pre',undefined,stream==='diff'?'diff':stream==='stderr'?'stderr':'');
        paint(pre,initial.content || (stream === 'diff' ? '无改动' : '（空）'),stream==='diff');
        const more = node('button','继续读取');
        more.type = 'button';
        more.hidden = !initial.truncated;
        let cursor = initial.next_cursor, text = initial.content || '';
        more.addEventListener('click', async () => {
          more.disabled = true;
          try {
            await ready;
            const page = unpack(await rpc('tools/call', {name:'read_output', arguments:{output_id:step.output_id,stream,cursor,max_bytes:4096}}));
            if (current !== generation) return;
            if (!Number.isInteger(page.next_cursor) || page.next_cursor < cursor || (page.truncated && page.next_cursor === cursor)) throw new Error('日志游标无进展');
            text += page.content;
            cursor = page.next_cursor;
            paint(pre,text,stream==='diff');
            more.hidden = !page.truncated;
            error.textContent = '';
          } catch (e) {error.textContent = e.message || String(e);}
          finally {more.disabled = false; resize();}
        });
        details.append(node('summary',stream+(initial.truncated?' · 已截断预览':'')),pre,more);
        details.addEventListener('toggle',resize);
        body.append(details);
      }
      if (step.operation_id) {
        const id = node('div','operation ' + step.operation_id);
        id.className = 'secondary';body.append(id);
      }
      if(step.streams?.diff?.truncated)body.append(node('div','增删计数仅覆盖当前 diff 片段','secondary'));
      article.append(body);article.addEventListener('toggle',resize);
      (isPatch?cards:commandGroup || cards).append(article);
    }
    cards.append(node('div','本次操作快照 · 退出码表示进程结果 · diff 仅记录受管修改 · 完整历史可通过 CLI 查询','foot'));
    resize();
  }
  window.addEventListener('message', event => {
    if (event.source !== window.parent || event.data?.jsonrpc !== '2.0') return;
    const message = event.data;
    if (Object.hasOwn(message,'id') && pending.has(message.id)) {
      const request = pending.get(message.id);
      pending.delete(message.id);clearTimeout(request.timer);
      if (message.error) request.reject(new Error(message.error.message || '读取被拒绝'));
      else request.resolve(message.result);
    } else if (message.method === 'ui/notifications/tool-result') render(message.params);
    else if (message.method === 'ui/notifications/tool-cancelled') {error.textContent = '调用已取消；远端停止状态以任务记录为准。';resize();}
  });
  const initial=window.openai?.toolResponseMetadata;
  if(initial)render(initial);
  const ready = rpc('ui/initialize', {appInfo:{name:'Remote Workbench records',version:'2.0.0'},appCapabilities:{},protocolVersion:'2026-01-26'})
    .then(() => {notify('ui/notifications/initialized',{});resize();});
  ready.catch(e => {error.textContent = e.message || String(e);});
})();
</script>
</html>
