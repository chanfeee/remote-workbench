<!doctype html>
<!-- Frontend reused from liteRemote activity/review UI, AGPL-3.0; see UPSTREAM.md. -->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Remote Workbench</title><style>:root{color-scheme:light dark;--bg:#fff;--surface:#f6f7f8;--border:rgba(31,35,40,.13);--text:#202124;--muted:#6f7378;--green:#16834a;--green-bg:rgba(22,155,83,.10);--red:#c63b3b;--red-bg:rgba(214,69,69,.10);--blue:#2980b9;--yellow:#906400}
@media(prefers-color-scheme:dark){:root{--bg:#171717;--surface:#222223;--border:rgba(255,255,255,.12);--text:#ececec;--muted:#a4a4a6;--green:#42c77b;--green-bg:rgba(66,199,123,.12);--red:#ff8585;--red-bg:rgba(255,112,112,.12);--blue:#66b8e8;--yellow:#f3bd62}}
*{box-sizing:border-box}
html,body{margin:0;min-height:0;height:auto}
body{background:var(--bg);color:var(--text);font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
#content{display:flow-root;min-width:0}
#content[data-pending]{min-height:96px}
[hidden]{display:none!important}
.card{width:100%;min-width:0;overflow:hidden}
.header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:9px 12px;border-bottom:1px solid var(--border)}
.title{font-size:12px;font-weight:600}
.workspace{grid-column:1/-1;grid-row:2;color:var(--muted);font:11px/1.5 ui-monospace,"SFMono-Regular",Consolas,monospace;overflow-wrap:anywhere}
.status,.totals{grid-column:2;grid-row:1;align-self:start;font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.status,.add{color:var(--green)}
.failed,.del{color:var(--red)}
.warning{color:var(--yellow)}
.section-count{margin-left:4px;color:var(--muted);font-weight:400}
.list,.file-list{list-style:none;margin:0;padding:0}
.item+.item,.file-item+.file-item{border-top:1px solid var(--border)}
summary{cursor:pointer;user-select:none;list-style:none}
summary::-webkit-details-marker{display:none}
summary::marker{content:""}
summary:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:-3px}
.item>details>summary{display:grid;grid-template-columns:10px 14px minmax(0,1fr) auto;align-items:start;gap:8px;padding:10px 12px}
.item>details>summary::before,.file-change>summary::before{content:"›";color:var(--muted);font:17px/18px ui-sans-serif,system-ui}
.item>details[open]>summary::before,.file-change[open]>summary::before{transform:rotate(90deg)}
.state{font-size:12px;font-weight:600;color:var(--green)}
.state.failed{color:var(--red)}
.state.warning{color:var(--yellow)}
.command{min-width:0}
.primary{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,"SFMono-Regular",Consolas,monospace}
.item>details[open] .primary{display:block;-webkit-line-clamp:unset}
.secondary{display:block;margin-top:3px;color:var(--muted);font-size:11px;overflow-wrap:anywhere}
.metric{padding-top:1px;color:var(--muted);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.detail{padding:0 12px 10px 44px;color:var(--muted);font-size:11px}
.detail:empty{display:none}
.detail-line{margin-top:5px}
.activity-view pre{max-height:320px;overflow:auto;margin:5px 0 0;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font:12px/1.5 ui-monospace,"SFMono-Regular",Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.activity-view pre.stderr{color:var(--red)}
.file-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;min-height:30px;padding:5px 12px;background:var(--surface)}
.file-change>summary{grid-template-columns:10px minmax(0,1fr) auto}
.file-path{min-width:0;overflow-wrap:anywhere;font:12px ui-monospace,"SFMono-Regular",Consolas,monospace}
.stat{white-space:nowrap;font:11px ui-monospace,"SFMono-Regular",Consolas,monospace}
.foot{padding:6px 12px;color:var(--muted);font-size:11px;overflow-wrap:anywhere}
.review-view pre{max-height:380px;overflow:auto;margin:0;border-top:1px solid var(--border);background:var(--surface);font:12px/1.55 ui-monospace,"SFMono-Regular",Consolas,monospace}
.line{display:grid;grid-template-columns:4.5ch 4.5ch 2ch max-content;width:max-content;min-width:100%;min-height:1.55em;white-space:pre}
.gutter{text-align:right;color:var(--muted);padding-right:.65ch;user-select:none;font-variant-numeric:tabular-nums}
.line-sign{text-align:center;user-select:none}
.line-code{padding-right:12px}
.line.added{color:var(--green);background:var(--green-bg)}
.line.deleted{color:var(--red);background:var(--red-bg)}
.line.meta{color:var(--muted)}
.line.hunk{color:var(--muted);background:color-mix(in srgb,var(--blue) 9%,var(--surface))}
.aggregate-diff{border-top:1px solid var(--border)}
.aggregate-diff>summary,.activity-group>summary{padding:8px 12px;color:var(--muted);font-size:12px}
.empty,.error,#error{padding:9px 12px;color:var(--muted);overflow-wrap:anywhere}
.error,#error{color:var(--red)}
button{margin:6px 0 0;padding:4px 8px;border:1px solid var(--border);border-radius:5px;background:var(--surface);color:var(--text);font:inherit;font-size:11px;line-height:1.4;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
@media(max-width:520px){.item>details>summary{grid-template-columns:10px 14px minmax(0,1fr);gap:5px 7px}.metric{grid-column:3}.detail{padding-left:43px}.header{gap:3px 8px}.workspace{font-size:10.5px}}
</style></head><body><div id="content" data-pending><section class="review-view"><main class="card" id="review" aria-live="polite" hidden></main></section>
<section class="activity-view"><main class="card" id="activity" aria-live="polite" hidden></main></section><div id="error" role="status" hidden></div></div>
<script>
(() => {
  'use strict';
  function outcome(item){
    const state=String(item.state || '').toLowerCase();
    let kind;
    if(item.error==='compute_review_required')kind='decision';
    else if(item.executed===false||state==='not_run')kind='not_run';
    else if(['cancellation_requested','cancel_requested','cancelling'].includes(state))kind='cancelling';
    else if(['unknown','remote_state_unknown','cancellation_unconfirmed'].includes(state)||item.cleanup_state==='unconfirmed')kind='unknown';
    else if(item.timed_out||['timeout','timed_out'].includes(state))kind='timeout';
    else if(['cancelled','canceled'].includes(state))kind='cancelled';
    else if(['running','starting','queued'].includes(state))kind='running';
    else if(item.error||item.test_summary?.status==='failed'||['failed','rejected'].includes(state)||
            (item.exit_code!=null&&item.exit_code!==0))kind='failed';
    else if(item.test_summary?.status==='completed')kind='unverified';
    else if(['finished','completed','success','checked'].includes(state)&&
            (item.tool==='apply_patch'||Number.isInteger(item.exit_code)))kind='complete';
    else kind='unknown';
    const labels={complete:'已完成',failed:'失败',unknown:'状态未知',timeout:'已超时',
      cancelled:'已取消',cancelling:'取消待确认',running:'运行中',not_run:'未执行',
      decision:'未执行 · 需要确认',unverified:item.test_summary?.executed ? '测试结果待核对' : '没有测试通过记录'};
    return {kind,label:(item.timed_out&&kind==='unknown'?'已超时 · ':'')+labels[kind]};
  }
  function createReview(root){
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);

    function diffLines(diff, showFileHeaders = true) {
      let oldLine = 0, newLine = 0, oldLeft = 0, newLeft = 0;
      return diff.replace(/\n$/, '').split('\n').map(line => {
        let kind = 'meta', before = '', after = '', sign = '', code = line;
        const hunk = /^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@/.exec(line);
        if (hunk) {
          kind = 'hunk';
          oldLine = Number(hunk[1]); oldLeft = Number(hunk[2] ?? 1);
          newLine = Number(hunk[3]); newLeft = Number(hunk[4] ?? 1);
        } else if ((oldLeft || newLeft) && /^[ +\-]/.test(line)) {
          sign = line[0]; code = line.slice(1);
          kind = sign === '+' ? 'added' : sign === '-' ? 'deleted' : '';
          if (sign !== '+') { before = oldLine++; oldLeft--; }
          if (sign !== '-') { after = newLine++; newLeft--; }
        } else if (!showFileHeaders && /^(diff --git |index |--- |\+\+\+ )/.test(line)) {
          return '';
        }
        return `<span class="line ${kind}"><span class="gutter" aria-hidden="true">${before}</span><span class="gutter" aria-hidden="true">${after}</span><span class="line-sign">${sign}</span><span class="line-code">${escapeHtml(code)}</span></span>`;
      }).join('');
    }

    const render = (payload) => {
      if (!payload) return;
      let notice = '';
      if (!payload.success) {
        const paths = (label, names) => names?.length ? label + names.join('、') : '';
        const details = [payload.state_label, payload.error || "操作失败", payload.message,
          payload.applied_diff ? '' : paths('已应用 ', payload.applied_paths), paths('待处理 ', payload.pending_paths)];
        notice = `<div class="error" role="alert">${details.filter(Boolean).map(escapeHtml).join('<br>')}</div>`;
      } else if (payload.state_label) {
        notice = `<div class="error" role="alert">${escapeHtml(payload.state_label)}</div>`;
      }
      const showFiles = payload.success || payload.applied_diff;
      const files = showFiles ? payload.files : [];
      const rows = files.map((file, index) => {
        const path = file.previous_path ? `${file.previous_path} → ${file.path}` : file.path || '(unknown)';
        const added = Number.isInteger(file.additions) ? file.additions : "–";
        const deleted = Number.isInteger(file.deletions) ? file.deletions : "–";
        const row = `
          <span class="file-path" title="${escapeHtml(path)}">${escapeHtml(path)}</span>
          <span class="stat"><span class="add">+${added}</span> <span class="del">-${deleted}</span></span>`;
        const fileDiff = file.diff || "";
        if (!fileDiff && !file.range) return `<li class="file-row">${row}</li>`;
        const detailId = `rwb-detail-${payload.step_index}-file-${index}`;
        const content = fileDiff ? () => `<pre aria-label="${escapeHtml(path)} diff">${diffLines(fileDiff, false)}</pre>`
          : fileDiffBody(payload.step_index, index, file.range, escapeHtml(path));
        return `<li class="file-item"><details class="file-change" data-detail="${detailId}">
          <summary class="file-row">${row}</summary>
          ${lazyBody(detailId, content)}
        </details></li>`;
      }).join("");
      const fileCount = Number.isInteger(payload.files_changed) ? payload.files_changed : files.length;
      const diff = payload.diff || "";
      const hasPerFileDiff = files.length && files.every(file => file.diff || file.range);
      const detailId = `rwb-detail-${payload.step_index}-diff`;
      const diffLabel = showFiles ? '查看逐行 diff' : '查看提交的补丁';
      const details = diff && !hasPerFileDiff ? `<details class="aggregate-diff" data-detail="${detailId}"><summary>${diffLabel}${payload.diff_truncated ? "（已截断）" : ""}</summary>${lazyBody(detailId, () => {
        const data = steps[payload.step_index]?.streams?.diff;
        return `<pre id="rwb-output-${payload.step_index}-diff">${diffLines(data?.content ?? diff)}</pre>${moreButton(payload.step_index, "diff", data?.truncated ?? payload.diff_truncated)}`;
      })}</details>` : "";
      const foot = payload.files_truncated ? `<div class="foot">文件列表已截断</div>` : "";
      const fileList = showFiles ? `
        <header class="header">
          <span class="title">${payload.check_only ? "预览 · " : ""}${fileCount} 个文件变更${payload.partial ? "（片段）" : ""}</span>
          <span class="workspace">${escapeHtml(payload.host)} · ${escapeHtml(payload.cwd || "")}</span>
          <span class="totals"><span class="add">+${payload.additions ?? 0}</span> <span class="del">-${payload.deletions ?? 0}</span></span>
        </header>
        <ul class="file-list">${rows || '<li class="empty">没有文件变更</li>'}</ul>` : '';
      root.innerHTML = `${notice}${fileList}${details}${foot}`;
    };


    return {render,diffLines};
  }
  function createActivity(root){
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);
    const elapsed = (value) => Number.isFinite(value) ?
      (value >= 1000 ? `${(value / 1000).toFixed(2)}s` : `${value}ms`) : "–";
    const commandText = (item) => item.command_display ??
      (Array.isArray(item.command) ? item.command.join(" ") : String(item.command ?? ""));
    const statusClass = (success, warning) => !success ? "failed" : (warning ? "warning" : "");
    const statusMark = (success, warning) => !success ? "×" : (warning ? "!" : "✓");

    const renderCommand = (item) => {
      const status=outcome(item);
      const success = !['failed','timeout'].includes(status.kind);
      const warning = status.kind!=='complete'||Boolean(item.truncated);
      const detailId = `rwb-detail-${item.step_index}-command`;
      return `<li class="item"><details data-detail="${detailId}">
        <summary>
          <span class="state ${statusClass(success, warning)}">${statusMark(success, warning)}</span>
          <span class="command"><span class="primary">${escapeHtml(commandText(item))}</span>
            ${item.show_cwd ? `<span class="secondary">${escapeHtml(item.cwd || "")}</span>` : ""}</span>
          <span class="metric">exit ${item.exit_code ?? "–"} · ${elapsed(item.elapsed_ms)}${['complete','failed'].includes(status.kind)?'':' · '+status.label}</span>
        </summary>
        ${lazyBody(detailId, () => {
          const streams = steps[item.step_index]?.streams || {};
          const output = ['stdout', 'stderr'].map(stream => {
            const data = streams[stream];
            return data?.content ? `<div class="detail-line">${stream === 'stdout' ? '标准输出' : '标准错误'}${data.truncated ? '（截断）' : ''}</div><pre${stream === 'stderr' ? ' class="stderr"' : ''} id="rwb-output-${item.step_index}-${stream}">${escapeHtml(data.content)}</pre>${moreButton(item.step_index, stream, data.truncated)}` : '';
          }).join('');
          const batch = (item.batch_steps || []).map((step, index) => {
            const status = outcome(step);
            return `${index + 1}. ${status.label}${Number.isInteger(step.exit_code) ? ` · exit ${step.exit_code}` : ''}`;
          }).join('　');
          return (batch ? `<div class="detail-line">${escapeHtml(batch)}</div>` : '') + output
            + (item.error ? `<pre class="stderr">${escapeHtml(item.error)}</pre>` : '');
        }, 'detail')}
      </details></li>`;
    };

    const render = (payload) => {
      if (!payload) return;
      if (!payload.success) {
        root.innerHTML = `<div class="error">${escapeHtml(payload.error || payload.message || "操作失败")}</div>`;
        return;
      }
      const reads = Array.isArray(payload.reads) ? payload.reads : [];
      const commands = Array.isArray(payload.commands) ? payload.commands : [];
      const checks = payload.verification ? commands.flatMap(command =>
        command.batch_steps?.length ? command.batch_steps : [command]) : commands;
      const statuses=checks.map(outcome);
      const failures = reads.filter((item) => item.success === false).length +
                       statuses.filter(item=>['failed','timeout'].includes(item.kind)).length;
      const fileCheck = payload.file_verification;
      const fileFailures = fileCheck?.failed || [];
      const checkedFiles = (fileCheck?.checked || 0) - fileFailures.length;
      const outcomes = payload.verification ? [...statuses, ...commands.map(outcome)] : statuses;
      const notice=['decision','unknown','cancelling','running','timeout','cancelled','not_run','unverified']
        .map(kind=>outcomes.find(item=>item.kind===kind)).find(Boolean);
      const passed = statuses.filter(item => item.kind === 'complete').length;
      const tests = payload.verification ? commands.flatMap(command => {
        const summary = command.test_summary;
        return summary ? [Number.isInteger(summary.passed) && summary.passed > 0 ? `${summary.passed} 个测试通过` : '',
          Number.isInteger(summary.reported_skips) && summary.reported_skips > 0
            ? `${summary.reported_skips} 个测试跳过` : ''] : [];
      }) : [];
      const statusLabel=[checkedFiles ? `${checkedFiles} 个文件已核对` : '',
        fileFailures.length ? `${fileFailures.length} 个文件核对失败` : '',
        payload.verification && passed ? `${passed} 项通过` : '',
        failures?`${failures} 项失败`:'',notice?.label,...tests].filter(Boolean).join(' · ') ||
        (payload.verification && !checks.length ? '未运行' : '已完成');
      const cwdNote = payload.cwd_count > 1 ? ` · ${payload.cwd_count} 个目录` : "";
      const list = `<ul class="list">${commands.map(item=>renderCommand({...item,show_cwd:payload.cwd_count>1})).join("")}</ul>`;
      const alerts = payload.verification ? commands.map(command => {
        const status = outcome(command);
        if (status.kind === 'complete') return '';
        const failedSteps = (command.batch_steps || []).flatMap((step, index) => {
          const state = outcome(step);
          return state.kind === 'complete' ? [] : [`第 ${index + 1} 项 ${state.label}`];
        });
        const diagnostic = command.message || command.error || command.stderr?.trim().slice(0, 480);
        return `<div class="error" role="alert">${[status.label, ...failedSteps, diagnostic]
          .filter(Boolean).map(escapeHtml).join('<br>')}</div>`;
      }).join('') : '';
      const fileAlerts = fileFailures.map(({path,error}) => `${path} · ${error}`);
      root.innerHTML = `
        <header class="header">
          <span class="title">${payload.verification ? '验证' : '命令'} <span class="section-count">${commands.reduce((count, item) => count + (item.batch_steps?.length || 1), 0)}</span></span>
          <span class="workspace">${escapeHtml(payload.host)} · ${escapeHtml(payload.cwd || "")}${cwdNote}</span>
          <span class="status ${failures || fileFailures.length ? "failed" : notice ? "warning" : ""}">${statusLabel}</span>
        </header>
        ${fileAlerts.length ? `<div class="error" role="alert">${fileAlerts.map(escapeHtml).join('<br>')}</div>` : ''}
        ${alerts}
        ${!commands.length ? '' : payload.compact ? `<details class="activity-group"><summary>查看命令与输出</summary>${list}</details>` : list}
        `;
    };


    return {render};
  }
  const reviewView=createReview(document.getElementById('review'));
  const activityView=createActivity(document.getElementById('activity'));

  const reviewRoot=document.getElementById('review');
  const activityRoot=document.getElementById('activity');
  const errorRoot=document.getElementById('error');
  const contentRoot=document.getElementById('content');
  const pending=new Map(),detailViews=new Map(),mountedDetails=new Set(),fileDiffs=new Map();
  let serial=0,generation=0,steps=[],lastPayload,queuedPayload;
  let eventSerial=0,payloadEvent=0,errorEvent=0,queuedError,lastError='';
  let visible=typeof IntersectionObserver!=='function',frame=null,flushing=false;
  let needsResize=false,observedHeight,lastHeight,observing=false,readyPromise;
  let viewportWidth=window.innerWidth;
  const active=()=>visible&&!document.hidden;
  const notify=(method,params)=>window.parent.postMessage({jsonrpc:'2.0',method,params},'*');
  function schedule(){
    if(!active()||frame!==null||flushing)return;
    if(typeof requestAnimationFrame==='function')frame=requestAnimationFrame(flush);
    else flush();
  }
  function resize(height){
    if(!active())return;
    observedHeight=Number.isFinite(height)?height:undefined;needsResize=true;schedule();
  }
  function flush(){
    frame=null;if(!active())return;flushing=true;
    try{
      if(queuedPayload){
        const payload=queuedPayload;queuedPayload=undefined;
        if(paint(payload)&&errorEvent<=payloadEvent)queuedError='';
      }
      if(queuedError!==undefined){
        if(queuedError!==lastError){
          errorRoot.textContent=queuedError;errorRoot.hidden=!queuedError;lastError=queuedError;
          contentRoot.removeAttribute('data-pending');needsResize=true;observedHeight=undefined;
        }
        queuedError=undefined;
      }
      if(needsResize){
        needsResize=false;
        // A host height echo is not content. Read intrinsic geometry at most
        // once per animation frame, reusing ResizeObserver's measurement.
        const height=Math.max(1,Math.ceil(observedHeight ?? contentRoot.getBoundingClientRect().height));
        observedHeight=undefined;
        if(height!==lastHeight){lastHeight=height;notify('ui/notifications/size-changed',{height});}
      }
    }finally{flushing=false;}
  }
  function moreButton(index, stream, truncated, file) {
    if (!truncated) return '';
    const fileAttrs = file == null ? '' : ` data-file="${file}" id="rwb-more-${index}-diff-${file}"`;
    return `<button type="button" data-step="${index}" data-stream="${stream}"${fileAttrs}>继续读取</button>`;
  }
  function fileDiffBody(index, file, [start, end], label) {
    const data = {content:'', next_cursor:start, truncated:true, end};
    fileDiffs.set(file, data);
    return () => {
      if (data.next_cursor === start) void loadPage(index, 'diff', data, file);
      return `<pre id="rwb-output-${index}-diff-${file}" aria-label="${label} diff">${data.content ? reviewView.diffLines(data.content, false) : ''}</pre>${moreButton(index, 'diff', data.truncated, file)}`;
    };
  }
  function lazyBody(id,draw,className=''){
    detailViews.set(id,draw);
    return `<div id="${id}" class="${className}"></div>`;
  }
  function toggleDetail(event){
    const id=event.target.dataset?.detail,draw=detailViews.get(id);
    if(draw){
      const body=document.getElementById(id);
      if(event.target.open&&!mountedDetails.has(id)){body.innerHTML=draw();mountedDetails.add(id);}
      else if(!event.target.open&&mountedDetails.delete(id))body.innerHTML='';
    }
    resize();
  }
  function rpc(method,params){return new Promise((resolve,reject)=>{
    const id=++serial,timer=setTimeout(()=>{pending.delete(id);reject(new Error('读取超时'));},15000);
    pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');
  });}
  function showError(message){queuedError=String(message);errorEvent=++eventSerial;schedule();}
  function initialize(){
    if(!readyPromise){
      readyPromise=rpc('ui/initialize',{appInfo:{name:'Remote Workbench',version:'9.0.0'},appCapabilities:{},protocolVersion:'2026-01-26'})
        .then(()=>{notify('ui/notifications/initialized',{});resize();})
        .catch(error=>{readyPromise=undefined;showError(error.message || String(error));throw error;});
    }
    return readyPromise;
  }
  function activate(){
    if(active()){
      viewportWidth=window.innerWidth;
      if(!observing){observer?.observe(contentRoot);observing=true;}
      initialize().catch(()=>{});resize();
    }else{
      observer?.disconnect();observing=false;
      if(frame!==null){cancelAnimationFrame(frame);frame=null;}
    }
  }
  function operationPayload(result){
    // Live MCP notifications, legacy globals and canonical history snapshots
    // use different envelopes. Inspect only the documented result fields;
    // never interpret model-visible command text as UI metadata.
    for(const candidate of [result,result?.call_tool_result,result?.mcp_tool_result]){
      const payload=candidate?._meta?.['remote-workbench/operation'] || candidate?.['remote-workbench/operation'];
      if(Array.isArray(payload?.steps))return payload;
    }
    return null;
  }
  function render(result){
    const payload=operationPayload(result);
    if(!payload)return;
    queuedPayload=payload;payloadEvent=++eventSerial;schedule();
  }
  function paint(payload){
    const serialized=JSON.stringify(payload);
    if(serialized===lastPayload)return;
    lastPayload=serialized;
    // Pagination is local UI state. Do not mutate the host's saved preview,
    // or a repeated globals event could look like a different snapshot.
    steps=payload.steps.map(step=>({...step,streams:step.streams&&Object.fromEntries(
      Object.entries(step.streams).map(([name,data])=>[name,{...data}]))}));
    generation++;detailViews.clear();mountedDetails.clear();fileDiffs.clear();
    const patch=steps.findIndex(s=>s.tool==='apply_patch');
    reviewRoot.hidden=patch<0;
    if(patch>=0){
      const step=steps[patch],data=step.streams?.diff,summary=step.diff_summary,rows=summary?.files || [];
      const status=outcome(step);
      const text=data?.content || '',chunks=text.includes('diff --git ')?text.split(/(?=^diff --git )/m).filter(x=>x.startsWith('diff --git ')):[text];
      const perFile=Boolean(data&&!data.truncated&&rows.length&&chunks.length===rows.length);
      const preview=!perFile && rows.some(row=>row.range) ? new TextEncoder().encode(text) : null;
      const files=rows.map((row,index)=>{
        const [start,end]=row.range || [];
        let diff=perFile ? chunks[index] : '';
        if(preview && end <= preview.length)diff=new TextDecoder().decode(preview.subarray(start,end));
        return {path:row.path,previous_path:row.previous_path,additions:row.added,deletions:row.deleted,diff,range:row.range};
      });
      reviewView.render({success:!step.error,error:step.error,message:step.message,
        applied_diff:step.applied_diff,
        applied_paths:step.applied_paths,pending_paths:step.pending_paths,host:step.host || '',cwd:step.cwd || '',files,
        files_changed:files.length,additions:summary?.added,deletions:summary?.deleted,diff:text,
        diff_truncated:!!data?.truncated,partial:summary&&!summary.complete,check_only:step.check_only,
        state_label:status.kind==='complete'?'':status.label,step_index:patch});
    }
    const commands=steps.map((s,i)=>({...s,step_index:i})).filter(s=>s.tool==='exec_command').map(s=>({...s,
      stdout:s.streams?.stdout?.content || '',stderr:s.streams?.stderr?.content || '',
      stdout_truncated:!!s.streams?.stdout?.truncated,stderr_truncated:!!s.streams?.stderr?.truncated,
      truncated:!!(s.streams?.stdout?.truncated||s.streams?.stderr?.truncated)}));
    const patchStep = steps[patch];
    const verification = Boolean(patchStep && !patchStep.check_only && !patchStep.error);
    const context = commands[0] || patchStep;
    activityRoot.hidden=!commands.length && !verification;
    if(!activityRoot.hidden)activityView.render({success:true,reads:[],commands,verification,compact:payload.compact===true,
      file_verification:outcome(patchStep || {}).kind==='complete' ? patchStep?.file_verification : undefined,
      host:context.host || '',cwd:context.cwd || '',cwd_count:new Set(commands.map(s=>s.cwd)).size});
    contentRoot.removeAttribute('data-pending');needsResize=true;observedHeight=undefined;
    return true;
  }
  function readMore(event){
    const button=event.target.closest?.('button[data-step]');if(!button||button.disabled)return;
    const index=Number(button.dataset.step),stream=button.dataset.stream;
    const file=button.dataset.file == null ? undefined : Number(button.dataset.file);
    const data=file == null ? steps[index]?.streams?.[stream] : fileDiffs.get(file);
    return loadPage(index,stream,data,file,button);
  }
  async function loadPage(index,stream,data,file,button){
    if(!data?.truncated||data.loading)return;
    const current=generation,cursor=data.next_cursor;
    const maxBytes=data.end == null ? 4096 : Math.max(4,Math.min(4096,data.end-cursor));
    const suffix=file == null ? stream : `diff-${file}`;
    data.loading=true;if(button)button.disabled=true;
    try{
      await initialize();
      if(current!==generation)return;
      const response=await rpc('tools/call',{name:'read_output',arguments:{output_id:steps[index].output_id,stream,cursor,max_bytes:maxBytes}});
      if(response.isError)throw new Error(response.content?.[0]?.text || '读取失败');
      const page=response.structuredContent || JSON.parse(response.content.find(x=>x.type==='text').text);
      if(current!==generation)return;
      if(!Number.isInteger(page.next_cursor)||page.next_cursor<=cursor)throw new Error('读取未推进');
      let content=page.content;
      if(data.end != null && page.next_cursor > data.end){
        content=new TextDecoder().decode(new TextEncoder().encode(content).subarray(0,data.end-cursor));
      }
      data.content+=content;
      data.next_cursor=data.end == null ? page.next_cursor : Math.min(page.next_cursor,data.end);
      data.truncated=data.end == null ? page.truncated : data.next_cursor<data.end;
      const pre=document.getElementById(`rwb-output-${index}-${suffix}`);
      if(pre){if(stream==='diff')pre.innerHTML=reviewView.diffLines(data.content,file == null);else pre.textContent=data.content;}
      const more=button || document.getElementById(`rwb-more-${index}-${suffix}`);
      if(more)more.hidden=!data.truncated;
      showError('');
    }catch(e){if(current===generation)showError(e.message || String(e));}
    finally{data.loading=false;if(button)button.disabled=false;resize();}
  }
  reviewRoot.addEventListener('click',readMore);activityRoot.addEventListener('click',readMore);
  reviewRoot.addEventListener('toggle',toggleDetail,true);activityRoot.addEventListener('toggle',toggleDetail,true);
  window.addEventListener('resize',()=>{
    if(!active()||window.innerWidth===viewportWidth)return;
    viewportWidth=window.innerWidth;resize();
  });
  // History hydration is cheap while offscreen: retain only the newest payload.
  window.addEventListener('openai:set_globals',event=>{
    const globals=event.detail?.globals;
    if(globals?.toolResponseMetadata)render(globals.toolResponseMetadata);
  });
  const observer=typeof ResizeObserver==='function'?new ResizeObserver(entries=>resize(entries[0]?.contentRect?.height)):null;
  document.addEventListener?.('visibilitychange',activate);
  window.addEventListener('message',event=>{
    if(event.source!==window.parent||event.data?.jsonrpc!=='2.0')return;
    const message=event.data,request=pending.get(message.id);
    if(request){pending.delete(message.id);clearTimeout(request.timer);message.error?request.reject(new Error(message.error.message || '读取失败')):request.resolve(message.result);}
    else if(message.method==='ui/notifications/tool-result')render(message.params);
    else if(message.method==='ui/notifications/tool-cancelled')showError('调用已取消；远端状态待确认');
  });
  // Complete the protocol handshake even offscreen: some hosts keep a view
  // hidden until initialized. Visibility gates drawing, not connection setup.
  initialize().catch(()=>{});
  const initial=window.openai?.toolResponseMetadata;if(initial)render(initial);
  if(typeof IntersectionObserver==='function'){
    new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;activate();},{rootMargin:'256px 0px'}).observe(contentRoot);
  }else activate();

})();
</script></body></html>
